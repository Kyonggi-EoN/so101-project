# ──────────────────────────────────────────────────────────────
# 사이트 설정
# 자주 바꾸지 않는 값만 둡니다. 프로젝트·문서 목록 같은 콘텐츠는
# _projects/, _data/ 쪽을 고치세요. (README.md 참고)
# 이 파일을 고친 뒤에는 로컬 서버(jekyll serve)를 다시 켜야 반영됩니다.
# ──────────────────────────────────────────────────────────────

title: SO-101 로봇팔
description: 경기대학교 EoN 동아리의 SO-101 로봇팔 프로젝트. 부원들이 만든 로봇팔 프로젝트와 처음 시작하는 법을 모아 둡니다.
url: https://kyonggi-eon.github.io
baseurl: /so101-project
lang: ko
timezone: Asia/Seoul

repo: Kyonggi-EoN/so101-project
repo_branch: master   # 코드·문서 링크가 가리키는 브랜치

# EoN 홈페이지. 이 사이트는 홈페이지의 CSS·JS·로고를 그대로 불러 써서 같은 모양을 냅니다.
# (홈페이지에서 디자인을 고치면 여기도 같이 바뀝니다. README.md의 '메인 사이트와 맞춰 둔 것' 참고)
main_site: https://kyonggi-eon.github.io

# 바람 테마 (홈페이지 _config.yml의 wind와 같은 뜻)
wind:
  pages: prey  # 페이지 제목 칸 오른쪽 줄기 떼. prey: 마우스를 쫓아옴, obstacle: 비켜 감, false: 안 그림
  lines: true  # 섹션 제목줄 아래 선·푸터 위 선을 타고 한 번 지나가는 줄기

# 검색엔진·SNS 미리보기 (jekyll-seo-tag)
logo: https://kyonggi-eon.github.io/assets/images/logo.png
image: https://kyonggi-eon.github.io/assets/images/og.png

collections:
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  - scope: { path: "", type: pages }
    values: { layout: page }
  - scope: { path: "", type: projects }
    values: { layout: project }

# ── 빌드 ──────────────────────────────────────────────────────
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor/
